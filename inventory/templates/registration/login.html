{% extends 'inventory/base.html' %}

{% block title %}Admin Login | DistroLoom{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="form-card">
        <h2>🔐 Admin Login</h2>

        {% if messages %}
        {% for message in messages %}
        <div
            style="background: #fee2e2; color: #dc2626; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1.25rem; font-size: 0.875rem; text-align: center; font-weight: 500;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn-primary" style="margin-top: 0.75rem;">
                Login to DistroLoom
            </button>
        </form>

        <div class="form-card-footer">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
